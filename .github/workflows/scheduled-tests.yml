name: Scheduled Tests

# Weekly run against the newest releases of every dependency, so an upstream
# break (fastmcp, sqlalchemy, arkiv, ...) surfaces before the next push does.
on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[dev,mcp]"

      - name: Run tests
        run: python -m pytest -v --tb=short
