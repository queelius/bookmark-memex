[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string support
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-memex"
version = "0.1.0"
description = "Personal bookmark archive with MCP server, FTS5 search, and content caching"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Towell", email = "lex@metafunctor.com"}
]
dependencies = [
    # Bundle I/O (write_bundle / iter_jsonl) for the arkiv exporter and importer.
    "arkiv>=0.4",
    "sqlalchemy>=2.0",
    "beautifulsoup4",
    "requests",
    "rich",
    "pyyaml",
    "jinja2",
    "markdownify",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = [
    "pytest",
    "pytest-cov",
    # Exact pin: lint and format output change between releases, and CI
    # installs this extra, so local and CI runs agree. Bump deliberately.
    "ruff==0.17.1",
    "mypy",
]

[project.scripts]
bookmark-memex = "bookmark_memex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookmark_memex", "bookmark_memex.*"]

[tool.setuptools.package-data]
# Ship vendored sql.js (no CDN dependency for the HTML SPA export) and the
# SPA HTML template alongside the Python sources.
"bookmark_memex.exporters.vendored" = ["*.js", "*.wasm"]
"bookmark_memex.exporters.templates" = ["*.html"]

[tool.ruff]
target-version = "py310"
# 88, not the 120 the old black/flake8 configs declared: no formatter was ever
# applied at 120, and the code as written already wraps at 88.
line-length = 88

[tool.ruff.lint]
# The policy the old .flake8 encoded (pycodestyle + pyflakes), carried over
# as-is rather than widened to ruff's own default selection.
select = ["E", "W", "F"]
ignore = ["E501"]  # long lines are the formatter's call, not the linter's

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports are intentional

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
